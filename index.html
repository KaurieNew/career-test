<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF7F1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23D97742'/><circle cx='16' cy='16' r='6' fill='%23FFF9F0'/></svg>">
<title>12 种职业人格测评 · 有些工作真的会把人越养越好</title>
<style>
  :root{
    --bg:#FBF7F1; --ink:#3D3128; --muted:#8B7A6B; --line:#EADFD1;
    --card:#FFFDF9; --accent:#D97742; --accent-soft:#F6E3D2; --gold:#E8B45C;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:16px; line-height:1.75; letter-spacing:.2px;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:520px;margin:0 auto;padding:0 22px 60px;min-height:100vh;}
  .screen{animation:fade .45s ease both;}
  .hidden{display:none !important;}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  h1,h2,h3{font-family:"Songti SC","Source Han Serif SC",Georgia,serif;font-weight:700;letter-spacing:.5px;}

  /* ---------- 封面 ---------- */
  #cover{padding-top:64px;}
  .kicker{
    display:inline-block;font-size:12px;letter-spacing:2px;color:var(--accent);
    border:1px solid var(--accent-soft);background:#fff;border-radius:999px;padding:5px 14px;margin-bottom:26px;
  }
  #cover h1{font-size:34px;line-height:1.45;margin:0 0 22px;}
  #cover h1 em{font-style:normal;color:var(--accent);}
  .lead{color:var(--muted);font-size:15px;margin:0 0 34px;}
  .cover-list{list-style:none;padding:0;margin:0 0 36px;}
  .cover-list li{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px 18px;margin-bottom:10px;font-size:14px;color:var(--muted);
  }
  .cover-list b{color:var(--ink);font-weight:600;}
  .btn{
    display:block;width:100%;border:none;border-radius:14px;padding:16px;font-size:16px;
    font-family:inherit;font-weight:600;letter-spacing:1px;cursor:pointer;
    background:var(--ink);color:#FFF9F0;transition:.2s;
  }
  .btn:active{transform:scale(.985);background:#2C231C;}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);}
  .tiny{font-size:11.5px;color:#A79684;line-height:1.7;margin-top:18px;}

  /* ---------- 答题 ---------- */
  #quiz{padding-top:26px;}
  .qbar{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);letter-spacing:1px;}
  .track{height:3px;background:#EDE2D3;border-radius:3px;margin:14px 0 40px;overflow:hidden;}
  .track i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .3s ease;}
  .qtext{font-size:21px;line-height:1.65;font-family:"Songti SC","Source Han Serif SC",Georgia,serif;margin:0 0 32px;min-height:100px;}
  .opt{
    display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:15px 18px;margin-bottom:11px;font-size:15px;color:var(--ink);
    font-family:inherit;cursor:pointer;transition:.16s;
  }
  .opt:active{border-color:var(--accent);background:var(--accent-soft);}
  .opt.on{border-color:var(--accent);background:var(--accent-soft);}
  .qfoot{display:flex;justify-content:space-between;align-items:center;margin-top:26px;}
  .link{background:none;border:none;color:var(--muted);font-size:13px;font-family:inherit;cursor:pointer;padding:6px 0;}
  .link:disabled{opacity:.3;}

  /* ---------- 加载 ---------- */
  #loading{padding-top:120px;text-align:center;}
  .spinner{
    width:44px;height:44px;margin:0 auto 26px;border:2px solid var(--accent-soft);
    border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #loading p{color:var(--muted);font-size:14px;}

  /* ---------- 结果 ---------- */
  #result{padding-top:34px;}
  .r-kicker{font-size:12px;letter-spacing:2px;color:var(--accent);margin-bottom:10px;}
  .r-code{
    font-family:Georgia,serif;font-size:13px;letter-spacing:3px;color:var(--muted);
    border:1px solid var(--line);border-radius:6px;padding:3px 9px;display:inline-block;margin-bottom:14px;background:#fff;
  }
  .r-name{font-size:32px;margin:0 0 10px;line-height:1.4;}
  .r-slogan{font-size:15px;color:var(--accent);margin:0 0 30px;font-weight:600;}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;margin-bottom:16px;}
  .panel h3{font-size:16px;margin:0 0 14px;display:flex;align-items:center;gap:8px;}
  .panel h3::before{content:"";width:4px;height:15px;background:var(--accent);border-radius:2px;display:inline-block;}
  .panel p{margin:0;font-size:14.5px;color:#5B4B3F;line-height:1.85;}
  .radar-wrap{display:flex;flex-direction:column;align-items:center;}
  .radar-wrap svg{width:100%;max-width:280px;height:auto;}
  .index-row{display:flex;align-items:center;gap:18px;margin-bottom:6px;}
  .index-num{font-family:Georgia,serif;font-size:44px;font-weight:700;color:var(--accent);line-height:1;}
  .index-num small{font-size:14px;color:var(--muted);font-weight:400;}
  .index-desc{font-size:13px;color:var(--muted);line-height:1.7;}
  .tags{display:flex;flex-wrap:wrap;gap:8px;}
  .tag{font-size:12.5px;padding:6px 13px;border-radius:999px;background:#F4EBE0;color:#6B5847;}
  .tag.gold{background:#FBF0DA;color:#9A6E17;}
  .career{font-size:14px;color:#5B4B3F;line-height:2.1;}
  .career span{display:inline-block;border-bottom:1px dashed var(--line);margin-right:12px;}
  .two{display:grid;grid-template-columns:1fr;gap:16px;}
  .col{border-radius:16px;padding:18px 18px 16px;}
  .col.up{background:#F3F7EF;border:1px solid #DDE8D5;}
  .col.down{background:#FAF0EC;border:1px solid #F0DCD2;}
  .col h4{margin:0 0 10px;font-size:14px;letter-spacing:.5px;}
  .col.up h4{color:#4F7440;}
  .col.down h4{color:#B0603E;}
  .col ul{margin:0;padding-left:16px;font-size:13.5px;color:#5B4B3F;line-height:1.95;}
  .tension{background:#FFF8E9;border:1px solid #F0E0BB;border-radius:14px;padding:16px 18px;font-size:13.5px;color:#7A5F2B;line-height:1.85;margin-bottom:16px;}
  .foot{margin-top:28px;border-top:1px solid var(--line);padding-top:20px;}
  .foot h5{font-size:12px;letter-spacing:1.5px;color:var(--muted);margin:0 0 10px;font-weight:600;}
  .foot ul{margin:0;padding-left:16px;font-size:11.5px;color:#A79684;line-height:1.85;}
  .copied{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(61,49,40,.92);color:#FFF9F0;font-size:13px;padding:10px 20px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;}
  .copied.on{opacity:1;}
</style>
</head>
<body>
<div id="app">

  <!-- 封面 -->
  <section id="cover" class="screen">
    <div class="kicker">12 种职业人格 · 32 题 · 约 5 分钟</div>
    <h1>有些工作<br>真的会把人<em>越养越好</em></h1>
    <p class="lead">不是所有工作都在消耗你。<br>有的工作，会把你的天赋越养越大；<br>有的工作，做一天就少一点自己。</p>
    <ul class="cover-list">
      <li><b>不是玄学：</b>题目依据霍兰德职业兴趣理论、大五人格模型、施恩职业锚理论设计</li>
      <li><b>不是标签：</b>测出你的兴趣结构 + 人格底色 + 内在驱动力，三层合一</li>
      <li><b>不只是结果：</b>给出适合你的职业方向，也给出会耗干你的岗位特征</li>
    </ul>
    <button class="btn" id="startBtn">开始测评</button>
    <p class="tiny">本测评为自我探索工具，非临床心理诊断工具，结果不构成职业决策的唯一依据。<br>请按第一直觉作答，不要反复斟酌。</p>
  </section>

  <!-- 答题 -->
  <section id="quiz" class="screen hidden">
    <div class="qbar"><span id="qidx">01 / 32</span><span id="qhint">按第一直觉选</span></div>
    <div class="track"><i id="qbar"></i></div>
    <p class="qtext" id="qtext"></p>
    <div id="opts"></div>
    <div class="qfoot">
      <button class="link" id="backBtn">← 上一题</button>
      <button class="link" id="quitBtn">重新开始</button>
    </div>
  </section>

  <!-- 加载 -->
  <section id="loading" class="screen hidden">
    <div class="spinner"></div>
    <p id="loadingTxt">正在解读你的兴趣结构…</p>
  </section>

  <!-- 结果 -->
  <section id="result" class="screen hidden"></section>
</div>
<div class="copied" id="toast">已复制</div>

/* ============ 文案库 ============ */
const TAG_EXT = v => v>=7 ? '人群充电型' : '独处回血型';
const TAG_NEU = v => v>=7 ? '高感知型' : '钝感稳态型';
const TAG_OPEN = v => v>=7 ? '新奇探索型' : '务实收敛型';
const TAG_AGR = v => v>=7 ? '柔和协作型' : '锋利直给型';
const TAG_CON = v => v>=7 ? '交付可靠型' : '弹性随性型';

const ANCHOR = {
  M1:{name:'专业深耕', line:'你需要一份能持续积累“别人替代不了”的手艺的工作。涨薪慢一点可以接受，但专业不能贬值。'},
  M2:{name:'自主自由', line:'你需要对时间和方式有主导权。被管得太细的环境，会比你想象中更快耗掉你。'},
  M3:{name:'稳定安全', line:'你需要可预期的收入与清晰的上升路径。先活下来再谈成长，这不是保守，是你的真实需求。'},
  M4:{name:'挑战创造', line:'你需要不断有难题推着你走。太安逸的环境，反而会让你怀疑自己的价值。'}
};

/* ============ 状态 ============ */
let cur = 0;
const ans = new Array(QS.length).fill(null);

const $ = id => document.getElementById(id);

/* ============ 答题流程 ============ */
$('startBtn').onclick = () => {
  $('cover').classList.add('hidden');
  $('quiz').classList.remove('hidden');
  renderQ();
};

function renderQ(){
  const q = QS[cur];
  $('qidx').textContent = String(cur+1).padStart(2,'0') + ' / ' + QS.length;
  $('qbar').style.width = ((cur)/QS.length*100) + '%';
  $('qtext').textContent = q.t;
  const box = $('opts');
  box.innerHTML = '';
  SCALE.forEach((s,i)=>{
    const b = document.createElement('button');
    b.className = 'opt' + (ans[cur]===i+1 ? ' on' : '');
    b.textContent = s;
    b.onclick = () => pick(i+1);
    box.appendChild(b);
  });
  $('backBtn').disabled = cur===0;
  window.scrollTo({top:0,behavior:'smooth'});
}

function pick(v){
  ans[cur] = v;
  const opts = document.querySelectorAll('.opt');
  opts.forEach((o,i)=>o.classList.toggle('on', i===v-1));
  setTimeout(()=>{
    if(cur === QS.length-1){ finish(); }
    else { cur++; renderQ(); }
  }, 220);
}

$('backBtn').onclick = () => { if(cur>0){ cur--; renderQ(); } };
$('quitBtn').onclick = () => {
  if(confirm('重新开始？当前作答记录会清空。')){
    cur = 0; ans.fill(null);
    $('quiz').classList.add('hidden');
    $('result').classList.add('hidden');
    $('cover').classList.remove('hidden');
    window.scrollTo({top:0});
  }
};

/* ============ 计分 ============ */
function compute(){
  const s = {R:0,I:0,A:0,S:0,E:0,C:0,X:0,N:0,O:0,G:0,D:0,M1:0,M2:0,M3:0,M4:0};
  QS.forEach((q,i)=>{ s[q.d] += (ans[i]||3); });

  // 主导兴趣 + 次主导
  const rank = HEX.slice().sort((a,b)=> s[b]-s[a] || HEX.indexOf(a)-HEX.indexOf(b));
  const dom = rank[0], sec = rank[1];

  // 按霍兰德六边形相邻关系映射 12 型
  const [n1,n2] = NEXT[dom];
  let partner;
  if(sec===n1) partner = n1;
  else if(sec===n2) partner = n2;
  else partner = (s[n1] >= s[n2]) ? n1 : n2;

  // 六边形距离（1 相邻 / 2 相隔 / 3 相对）
  const i1 = HEX.indexOf(dom), i2 = HEX.indexOf(sec);
  const raw = Math.abs(i1-i2);
  const dist = Math.min(raw, 6-raw);

  // 职业锚
  const anchors = ['M1','M2','M3','M4'];
  const anchor = anchors.sort((a,b)=> s[b]-s[a])[0];

  // 天赋复利指数（自建指标）
  const interest = (s[dom]/15)*100;              // 主导兴趣饱和
  const con = (s.D/10)*100;                       // 交付可靠性
  const stable = ((10 - s.N)/10)*100;             // 情绪稳定性
  const index = Math.round(0.5*interest + 0.25*con + 0.25*stable);

  return {s, dom, sec, partner, dist, anchor, index, code: dom+'-'+partner};
}

/* ============ 渲染结果 ============ */
const LOAD_TXT = [
  '正在解读你的兴趣结构…',
  '正在比对 12 种职业人格…',
  '正在计算你的天赋复利…',
  '正在整理会耗干你的岗位…'
];

function finish(){
  $('quiz').classList.add('hidden');
  $('loading').classList.remove('hidden');
  window.scrollTo({top:0});
  let step = 0;
  const t = setInterval(()=>{
    $('loadingTxt').textContent = LOAD_TXT[Math.min(step, LOAD_TXT.length-1)];
    step++;
    if(step > LOAD_TXT.length){ clearInterval(t); showResult(); }
  }, 520);
}

function radarSVG(s){
  const cx=140, cy=140, r=92;
  const vals = HEX.map(k => Math.max(0.12, s[k]/15));
  const pt = (i,v) => {
    const ang = -Math.PI/2 + i*Math.PI/3;
    return [cx + Math.cos(ang)*r*v, cy + Math.sin(ang)*r*v];
  };
  let grid = '';
  [0.25,0.5,0.75,1].forEach(k=>{
    const pts = HEX.map((_,i)=> pt(i,k).join(',')).join(' ');
    grid += `<polygon points="${pts}" fill="none" stroke="#EADFD1" stroke-width="1"/>`;
  });
  let axes = '';
  HEX.forEach((_,i)=>{
    const [x,y] = pt(i,1);
    axes += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#EADFD1" stroke-width="1"/>`;
  });
  const shape = HEX.map((_,i)=> pt(i, vals[i]).join(',')).join(' ');
  let labels = '';
  HEX.forEach((k,i)=>{
    const [x,y] = pt(i,1.24);
    labels += `<text x="${x}" y="${y+4}" text-anchor="middle" font-size="12" fill="#8B7A6B" font-family="sans-serif">${DIM_NAME[k]}</text>`;
  });
  return `<svg viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg">
    ${grid}${axes}
    <polygon points="${shape}" fill="rgba(217,119,66,.22)" stroke="#D97742" stroke-width="2" stroke-linejoin="round"/>
    ${HEX.map((_,i)=>{const [x,y]=pt(i,vals[i]);return `<circle cx="${x}" cy="${y}" r="3.5" fill="#D97742"/>`}).join('')}
    ${labels}
  </svg>`;
}

    </div>

    <div class="panel">

    </div>

    ${tension}

    <div class="panel">

    </div>

    <div class="two">

      </div>
    </div>

    <div class="panel" style="margin-top:16px">

    <button class="btn" id="copyBtn" style="margin-top:8px">复制结果文案 · 分享给朋友</button>

    <div class="foot">

        <li>Holland, J. L.《Making Vocational Choices》— RIASEC 职业兴趣六型与六边形结构模型</li>
        <li>Costa &amp; McCrae — 大五人格模型（NEO-PI-R）</li>
        <li>Schein, E. H.《Career Anchors》— 职业锚理论</li>

        <li>结果反映的是你此刻的倾向，不是终身定论。人的兴趣会随经历变化，建议每 6-12 个月重测。</li>
        <li>职业选择请综合能力、机会、经济压力与现实条件，结果不构成任何决策承诺。</li>
      </ul>
    </div>
  `;
  el.classList.remove('hidden');
  window.scrollTo({top:0});

  $('copyBtn').onclick = () => {

}
